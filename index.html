<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmoud & Menna - Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            color: #f4f1ea;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        #envelope-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #2b2b2b 0%, #111111 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
        }
        .envelope {
            position: relative;
            width: 340px;
            height: 240px;
            background: #f4f1ea;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            cursor: pointer;
        }
        .seal {
            width: 60px;
            height: 60px;
            background: #bc6c25;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .open-btn {
            background: #bc6c25;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .open-btn:hover {
            background: #dda15e;
        }
        .main-content {
            max-width: 600px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
        }
        .main-content.visible {
            opacity: 1;
            transform: translateY(0);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #dda15e;
            margin-bottom: 10px;
        }
        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #d4a373;
            margin-bottom: 30px;
        }
        .photos-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .photo-card {
            width: 150px;
            height: 190px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 2px solid #dda15e;
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .invitation-text {
            font-size: 1rem;
            line-height: 1.8;
            color: #d8d8d8;
            margin-bottom: 40px;
        }
        .form-container {
            background: #252525;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #dda15e;
            font-family: 'Playfair Display', serif;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
        }
        .form-control:focus {
            outline: none;
            border-color: #dda15e;
        }
        .submit-btn {
            background: #dda15e;
            color: #1a1a1a;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
            transition: background 0.3s ease;
        }
        .submit-btn:hover {
            background: #bc6c25;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="envelope-container" onclick="openInvitation()">
        <div class="envelope">
            <div class="seal">M&M</div>
            <div style="text-align: center; color: #283618;">
                <p style="font-family: 'Playfair Display', serif; font-size: 0.9rem; letter-spacing: 2px;">SPECIAL INVITATION</p>
                <h3 style="font-family: 'Playfair Display', serif; font-size: 1.5rem; margin: 5px 0;">Click to Open</h3>
            </div>
            <button class="open-btn">OPEN</button>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <h1>Mahmoud & Menna</h1>
        <div class="subtitle">A Celebration of Love & Joy</div>

        <div class="photos-grid">
            <div class="photo-card">
                <img src="716B1CA9-5AD4-48B8-AF03-CB7393A83254.JPG" alt="Mahmoud">
            </div>
            <div class="photo-card">
                <img src="716B1CA9-5AD4-48B8-AF03-CB7393A83254 2.JPG" alt="Menna">
            </div>
        </div>

        <div class="invitation-text">
            We cordially invite you to celebrate with us on our special day.<br>
            Please let us know if you will be able to attend by filling out the RSVP form below. Your wishes mean the world to us!
        </div>

        <div class="form-container">
            <form action="https://formspree.io/f/xjgnpzno" method="POST">
                <input type="hidden" name="_to" value="salsabeel302002@gmail.com">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="attendance">Will you attend?</label>
                    <select id="attendance" name="attendance" class="form-control" required>
                        <option value="Joyfully Accepts">Joyfully Accepts</option>
                        <option value="Regretfully Declines">Regretfully Declines</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Wishes & Messages</label>
                    <textarea id="message" name="message" class="form-control" rows="4" placeholder="Write your warm wishes here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send RSVP & Wishes</button>
            </form>
        </div>
    </div>

    <script>
        function openInvitation() {
            const envelope = document.getElementById('envelope-container');
            const content = document.getElementById('mainContent');
            
            envelope.style.transform = 'translateY(-100%)';
            envelope.style.opacity = '0';
            setTimeout(() => {
                envelope.style.display = 'none';
                content.classList.add('visible');
            }, 800);
        }
    </script>
</body>
</html>
